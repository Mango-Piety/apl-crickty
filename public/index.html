<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CRICKTY | IPL Broadcaster Hub</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script id="tailwind-config">
tailwind.config = {
    darkMode: "class",
    theme: {
        extend: {
            colors: {
                "surface-variant": "#2e3541",
                "on-background": "#dce2f3",
                "primary-fixed-dim": "#e9c400",
                "tertiary-fixed": "#6ffbbe",
                "error-container": "#93000a",
                "outline": "#999077",
                "inverse-on-surface": "#2a313d",
                "surface-container": "#19202b",
                "on-tertiary": "#003824",
                "outline-variant": "#4d4732",
                "on-primary-container": "#705e00",
                "on-primary": "#3a3000",
                "surface-container-highest": "#2e3541",
                "secondary-fixed-dim": "#adc6ff",
                "error": "#ffb4ab",
                "secondary": "#adc6ff",
                "on-primary-fixed-variant": "#544600",
                "on-secondary-container": "#e6ecff",
                "on-primary-fixed": "#221b00",
                "surface-container-low": "#151c27",
                "surface-container-high": "#232a36",
                "on-tertiary-fixed-variant": "#005236",
                "surface-tint": "#e9c400",
                "secondary-container": "#0566d9",
                "on-error-container": "#ffdad6",
                "surface-bright": "#323946",
                "tertiary-container": "#65f2b5",
                "tertiary": "#d8ffe7",
                "on-secondary-fixed-variant": "#004395",
                "inverse-primary": "#705d00",
                "surface": "#0c141f",
                "primary": "#fff6df",
                "secondary-fixed": "#d8e2ff",
                "background": "#0c141f",
                "surface-dim": "#0c141f",
                "tertiary-fixed-dim": "#4edea3",
                "on-tertiary-fixed": "#002113",
                "on-secondary": "#002e6a",
                "on-surface-variant": "#d0c6ab",
                "primary-container": "#ffd700",
                "inverse-surface": "#dce2f3",
                "on-secondary-fixed": "#001a42",
                "on-tertiary-container": "#006d4a",
                "primary-fixed": "#ffe16d",
                "on-surface": "#dce2f3",
                "surface-container-lowest": "#070e19",
                "on-error": "#690005"
            },
            fontFamily: {
                "data-mono": ["Space Grotesk"],
                "body-lg": ["Lexend"],
                "label-caps": ["Space Grotesk"],
                "headline-lg": ["Lexend"],
                "display-bold": ["Lexend"],
                "headline-md": ["Lexend"],
                "body-md": ["Lexend"]
            }
        }
    }
}
</script>
<style>
.glass-card { background: rgba(46, 53, 65, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
.glow-gold { filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.4)); }
.custom-scrollbar::-webkit-scrollbar { width: 4px; }
.custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
.custom-scrollbar::-webkit-scrollbar-thumb { background: #ffd700; border-radius: 10px; }
body { min-height: max(884px, 100dvh); }
/* Gauge transition */
#emotion-gauge-circle { transition: stroke-dashoffset 1s ease-in-out, stroke 1s ease; }
</style>
</head>
<body class="bg-background text-on-background font-body-md selection:bg-primary-container selection:text-on-primary-container">

<header class="fixed top-0 w-full z-50 flex items-center justify-between px-6 h-16 bg-slate-950/40 backdrop-blur-md border-b border-white/10 shadow-[0_4_20px_rgba(0,0,0,0.5)]">
    <div class="flex items-center gap-4">
        <button class="material-symbols-outlined text-yellow-400 p-2 hover:bg-white/5 transition-colors rounded-lg">menu</button>
        <span class="text-2xl font-black text-yellow-400 drop-shadow-[0_0_8px_rgba(255,215,0,0.4)] font-['Lexend'] font-bold tracking-tighter">CRICKTY</span>
    </div>
    <div class="hidden md:flex items-center gap-8 glass-card px-6 py-2 rounded-full border-white/5">
        <div class="flex flex-col items-center">
            <span class="font-label-caps text-[10px] text-slate-400">MATCH STATUS</span>
            <span class="font-data-mono text-yellow-400 text-sm">LIVE: LKO vs RAJ</span>
        </div>
    </div>
    <div class="flex items-center gap-3">
        <div class="text-right hidden sm:block">
            <p class="font-label-caps text-[10px] text-yellow-400">ANALYST PRO</p>
            <p class="font-body-md text-xs font-bold">LIVE BROADCAST</p>
        </div>
    </div>
</header>

<main class="pt-24 pb-24 px-8 max-w-screen-2xl mx-auto grid grid-cols-12 gap-4">
    <!-- Hero Section -->
    <section class="col-span-12 lg:col-span-5 glass-card rounded-xl p-6 flex flex-col items-center justify-center min-h-[400px] relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-br from-primary-container/10 to-transparent pointer-events-none"></div>
        <h2 class="font-headline-md text-on-background mb-6 self-start z-10">Current Crowd Emotion</h2>
        
        <div class="relative w-64 h-64 flex items-center justify-center z-10">
            <svg class="w-full h-full transform -rotate-90">
                <circle class="text-surface-container-highest" cx="128" cy="128" fill="transparent" r="110" stroke="currentColor" stroke-width="12"></circle>
                <!-- 691 is circumference (2 * pi * 110) -->
                <circle id="emotion-gauge-circle" class="text-yellow-400 glow-gold" cx="128" cy="128" fill="transparent" r="110" stroke="currentColor" stroke-dasharray="691" stroke-dashoffset="345" stroke-width="12"></circle>
            </svg>
            <div class="absolute flex flex-col items-center">
                <span id="emotion-score-text" class="font-display-bold text-yellow-400 text-6xl drop-shadow-lg">0%</span>
                <span id="emotion-label" class="font-headline-md text-on-background mt-2">Loading...</span>
            </div>
        </div>
        
        <div class="mt-8 w-full flex justify-between gap-4 z-10">
            <div class="flex-1 glass-card p-4 rounded-lg text-center border-white/5">
                <p class="font-label-caps text-slate-400 mb-1">DATA SOURCE</p>
                <p class="font-data-mono text-lg text-yellow-400">Reddit API</p>
            </div>
            <div class="flex-1 glass-card p-4 rounded-lg text-center border-white/5">
                <p class="font-label-caps text-slate-400 mb-1">AI ENGINE</p>
                <p class="font-data-mono text-lg text-yellow-400">Gemini 2.5</p>
            </div>
        </div>
    </section>

    <!-- Emotional Pulse Chart -->
    <section class="col-span-12 lg:col-span-7 glass-card rounded-xl p-6 flex flex-col">
        <div class="flex justify-between items-center mb-6">
            <h2 class="font-headline-md text-on-background">Emotional Pulse Trend</h2>
            <div class="flex gap-2">
                <span class="bg-yellow-400/20 text-yellow-400 text-[10px] font-bold px-2 py-1 rounded border border-yellow-400/30 uppercase">Live Update</span>
            </div>
        </div>
        <div class="flex-1 w-full min-h-[250px] relative mt-4">
            <canvas id="pulseChart"></canvas>
        </div>
    </section>

    <!-- Live Feed -->
    <section class="col-span-12 md:col-span-12 glass-card rounded-xl p-6 flex flex-col max-h-[500px]">
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-3">
                <h2 class="font-headline-md text-on-background">Live Intelligence Feed</h2>
                <div class="flex items-center gap-2 px-2 py-0.5 bg-error-container/20 rounded border border-error-container/40">
                    <span class="w-1.5 h-1.5 rounded-full bg-error animate-pulse"></span>
                    <span class="text-[10px] font-bold text-error uppercase">Live Pulse</span>
                </div>
            </div>
        </div>
        <div id="live-feed-container" class="flex-1 overflow-y-auto custom-scrollbar space-y-4 pr-2">
            <!-- Feed items will be populated here -->
            <div class="p-4 bg-white/5 rounded-lg border-l-4 border-slate-500 text-slate-400">Waiting for live data...</div>
        </div>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
